name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - '.github/workflows/**'
              - 'Dockerfile'
              - 'codecov.yml'
              - 'index.html'
              - 'nginx.conf'
              - 'package-lock.json'
              - 'package.json'
              - 'public/**'
              - 'scripts/**'
              - 'src/**'
              - 'tests/**'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Upload dependency vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-remote-admin-web-npm-audit
          path: npm-audit.json
          if-no-files-found: error
      - run: scripts/run-quality-checks.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ./coverage/lcov.info
          use_oidc: true
