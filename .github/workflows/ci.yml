name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Upload dependency vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-remote-admin-web-npm-audit
          path: npm-audit.json
          if-no-files-found: error
      - run: scripts/run-quality-checks.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          use_oidc: true
